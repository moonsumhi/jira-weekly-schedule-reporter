name: Review EoS candidates

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - app/data/eos_map_snapshot.json
      - frontend/optool/src/data/vmware_lifecycle_snapshot.json
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to inspect
        required: true
        default: main
        type: choice
        options:
          - main
          - dev

permissions:
  contents: read

concurrency:
  group: update-eos-snapshot-${{ github.event_name == 'push' && github.ref_name || github.event.inputs.branch || 'main' }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.branch || 'main' }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check lifecycle mapping
        run: |
          python -m unittest discover -s tests -p test_vmware_snapshot.py
          python -m unittest discover -s tests -p test_lifecycle_audit.py

      - name: Collect unreviewed candidates
        run: python app/scripts/update_eos_snapshot.py --candidate-report lifecycle-candidates.json

      - name: Keep reviewed files unchanged
        run: git diff --exit-code -- app/data frontend/optool/src/data

      - name: Upload candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-candidates-${{ env.TARGET_BRANCH }}
          path: lifecycle-candidates.json
          retention-days: 30
